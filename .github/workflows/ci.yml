name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Format check (StyLua)
        uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.6.0
          args: --check .

      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1.5"
      - uses: leafo/gh-actions-luarocks@v4

      - name: Install tools
        run: luarocks install luacheck && luarocks install busted && luarocks install luacov

      - name: Lint (luacheck)
        run: luacheck .

      - name: Test (busted + luacov)
        run: busted --coverage

      - name: Coverage must stay at 100%
        run: |
          luacov
          total=$(grep -E '^Total' luacov.report.out | awk '{print $NF}')
          echo "Coverage: $total"
          if [ "$total" != "100.00%" ]; then
            awk '/^={10,}/{getline; f=$1; next} /^\*+0 /{print f": "$0}' luacov.report.out | head -20
            echo "::error::Coverage is $total; every line of addon code must be covered."
            exit 1
          fi
